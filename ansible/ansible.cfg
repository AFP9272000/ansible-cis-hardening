[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/cis_lab
# Lab-only: targets are ephemeral so host keys churn on every apply.
# Re-enable host key checking anywhere hosts persist.
host_key_checking = False
interpreter_python = auto_silent
deprecation_warnings = False

[ssh_connection]
pipelining = True
