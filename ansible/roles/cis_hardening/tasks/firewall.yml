---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable ufw logging
  community.general.ufw:
    logging: "on"

# Allow rules land before the default-deny and before enabling, so an
# Ansible run over SSH never cuts off its own connection.
- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ cis_hardening_ufw_allowed_tcp_ports }}"

- name: Default deny inbound traffic
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default allow outbound traffic
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable ufw
  community.general.ufw:
    state: enabled
